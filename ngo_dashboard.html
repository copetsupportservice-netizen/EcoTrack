<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Partner Dashboard – EcoTrack AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .ngo-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .member-table-card { background: var(--bg-secondary); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        .member-table { width: 100%; border-collapse: collapse; text-align: left; }
        .member-table th { padding: 1.2rem; background: rgba(255,255,255,0.02); color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        .member-table td { padding: 1.2rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .member-avatar { width: 36px; height: 36px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; }
        .contact-btn { padding: 0.4rem 0.8rem; border-radius: 8px; background: rgba(0, 212, 170, 0.1); color: var(--primary); border: 1px solid rgba(0, 212, 170, 0.2); font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .contact-btn:hover { background: var(--primary); color: white; }
    </style>
</head>
<body class="app-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><span class="logo-text">EcoTrack <b>AI</b></span></div>
        <nav class="sidebar-nav">
            <a href="ngo_dashboard.html" class="nav-item active"><span class="nav-label">NGO Dashboard</span></a>
            <a href="profile.html" class="nav-item"><span class="nav-label">Organization Profile</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-mini-profile">
                <div class="user-avatar" id="sidebarAvatar">N</div>
                <div class="user-info">
                    <div class="user-name" id="sidebarName">NGO Partner</div>
                    <div class="user-score-badge">Verified Partner</div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="page-title">Partner Dashboard</h1>
            <div id="ngoIdentity" style="color: var(--primary); font-weight: 600;"></div>
        </header>

        <div class="ngo-stats-grid">
            <div class="card">
                <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Total Members Joined</div>
                <div id="totalMembers" style="font-size: 2.5rem; font-weight: 800; font-family: 'Space Grotesk';">0</div>
            </div>
            <div class="card">
                <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Total Impact Reached</div>
                <div style="font-size: 2.5rem; font-weight: 800; font-family: 'Space Grotesk'; color: var(--primary);">4.2k kg</div>
            </div>
        </div>

        <div class="member-table-card card">
            <div class="card-header" style="padding: 1.5rem;">
                <h3>Joined Users (Members)</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Users who have officially joined your sustainability campaign.</p>
            </div>
            <table class="member-table">
                <thead>
                    <tr>
                        <th>User Name</th>
                        <th>Email Address</th>
                        <th>Phone</th>
                        <th>EcoScore</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="memberList">
                    <!-- Members will be injected here -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = requireAuth();
            if (user.role !== 'ngo' && user.role !== 'admin') {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('sidebarName').textContent = user.firstName;
            document.getElementById('sidebarAvatar').textContent = user.firstName[0];

            fetchMembers();
        });

        async function fetchMembers() {
            try {
                const data = await apiFetch('/ngo/members');
                if (data.success) {
                    document.getElementById('ngoIdentity').textContent = "Representing: " + data.ngoName;
                    document.getElementById('totalMembers').textContent = data.total;
                    
                    const list = document.getElementById('memberList');
                    if (data.members.length === 0) {
                        list.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 3rem; color: var(--text-muted);">No members have joined your NGO yet.</td></tr>';
                        return;
                    }

                    list.innerHTML = data.members.map(m => `
                        <tr>
                            <td>
                                <div style="display:flex; align-items:center;">
                                    <div class="member-avatar">${m.firstName[0]}</div>
                                    <div>
                                        <div style="font-weight:600;">${m.firstName} ${m.lastName || ''}</div>
                                        <div style="font-size:0.75rem; color:var(--text-muted);">Joined ${new Date(m.createdAt).toLocaleDateString()}</div>
                                    </div>
                                </div>
                            </td>
                            <td>${m.email}</td>
                            <td>${m.phone || 'Not provided'}</td>
                            <td><span style="color:var(--primary); font-weight:bold;">${m.ecoScore}</span></td>
                            <td>
                                <button class="contact-btn" onclick="window.location.href='mailto:${m.email}'">Contact User</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error("NGO Members fetch error:", err);
                showGlobalToast("Failed to load members", "error");
            }
        }
    </script>
</body>
</html>
